<title>lofi.room 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed 3D room canvas; small glass controls float on the corners so the room stays the hero. Single night look by choice. */
:root{
  --bg:#1a1430; --ink:#f4eefc; --mute:#b6a9d6; --glass:rgba(30,22,58,.74); --line:rgba(255,255,255,.14);
  --accent:#ffb86b; --pop:#ff8ad1; --ok:#3ddc97; --bad:#ff6b6b; --on-accent:#22152f;
  --display:"Jua","Noto Sans KR",system-ui,sans-serif; --body:"Noto Sans KR",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;transition:background .6s}
#c{position:fixed;inset:0;display:block;outline:none;touch-action:none}
.ui{position:fixed;z-index:2;pointer-events:none;inset:0}
.ui > *{pointer-events:auto}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:18px}
.brand{position:absolute;left:16px;top:calc(16px + env(safe-area-inset-top,0px));padding:10px 16px 10px 12px;display:flex;gap:10px;align-items:center}
.brand .lg{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--pop));display:grid;place-items:center;color:var(--on-accent);font-family:var(--display);font-size:20px}
.brand b{font-family:var(--display);font-weight:400;font-size:19px;display:block;line-height:1.1}
.brand span{font-size:12px;color:var(--mute)}
.themes{position:absolute;right:16px;top:calc(16px + env(safe-area-inset-top,0px));display:flex;gap:4px;padding:6px;align-items:center}
.themes button,.chip{font:inherit;font-size:13px;color:var(--mute);background:transparent;border:0;border-radius:12px;padding:9px 14px;cursor:pointer}
.themes button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
.themes .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.themes #edit{color:var(--ink);font-weight:700;background:linear-gradient(135deg,#9b7bff,var(--pop))}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{position:absolute;left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top,0px));padding:9px 16px;font-size:13px;color:var(--mute);white-space:nowrap;display:flex;align-items:center;gap:10px}
.hint b{color:var(--ink);font-weight:500}
.hint kbd{font:inherit;font-size:11px;background:rgba(255,255,255,.12);color:var(--ink);border-radius:5px;padding:1px 6px}
.hint .mode{background:var(--accent);color:var(--on-accent);font-weight:700;border-radius:8px;padding:2px 8px;font-size:12px}
.side{position:absolute;left:16px;top:calc(84px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;padding:6px}
.bottom{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(760px,calc(100% - 32px))}
.player{padding:12px 16px 12px 12px;display:flex;align-items:center;gap:14px}
.th{width:96px;height:56px;border-radius:10px;flex:none;background:linear-gradient(180deg,#2d1b5e,#7b3f8f 55%,var(--pop));position:relative}
.th::after{content:"";position:absolute;left:7px;top:7px;width:16px;height:11px;border-radius:3px;background:#ff3d3d}
.info{min-width:0;flex:1}
.info b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info span{font-size:12px;color:var(--mute)}
.bar{height:4px;border-radius:2px;background:rgba(255,255,255,.15);margin-top:8px;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;width:0;border-radius:2px;background:linear-gradient(90deg,var(--pop),var(--accent))}
.btn{width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);font-size:18px;cursor:pointer;flex:none;display:grid;place-items:center}
.btn.ghost{background:rgba(255,255,255,.1);color:var(--ink);width:36px;height:36px;font-size:14px;border-radius:10px}
.friends{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ok);white-space:nowrap}
.friends i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
/* inventory drawer */
.drawer{padding:12px 14px 14px}
.dh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dh b{font-family:var(--display);font-weight:400;font-size:18px}
.dtabs{display:flex;gap:4px;background:rgba(0,0,0,.25);border-radius:12px;padding:3px;flex:none}
.dtabs button{font:inherit;font-size:14px;border:0;background:transparent;color:var(--mute);border-radius:9px;padding:7px 12px;cursor:pointer;font-family:var(--display)}
.dtabs button[aria-selected="true"]{background:rgba(255,255,255,.14);color:var(--ink)}
.dh span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dh span{font-size:12px;color:var(--mute)}
.dh .acts{margin-left:auto;display:flex;gap:8px;flex:none}
.pill{white-space:nowrap}
.pill{font:inherit;font-size:13px;font-weight:700;border:0;border-radius:12px;padding:9px 16px;cursor:pointer;background:rgba(255,255,255,.1);color:var(--ink)}
.pill.save{background:var(--accent);color:var(--on-accent)}
.items{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.item{flex:none;width:96px;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:14px;padding:6px 6px 8px;color:var(--ink);font:inherit;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.item img{width:80px;height:68px;object-fit:contain}
.item:hover{border-color:var(--accent);background:rgba(255,184,107,.1)}
.item small{color:var(--mute);font-size:10px}
/* selection toolbar */
.tool{position:fixed;z-index:4;transform:translate(-50%,-100%);display:flex;align-items:center;gap:4px;padding:6px;white-space:nowrap}
.tool .nm{font-size:12px;font-weight:700;color:var(--accent);padding:0 8px 0 6px;border-right:1px solid var(--line)}
.tool button{font:inherit;font-size:12px;color:var(--ink);background:transparent;border:0;border-radius:9px;padding:7px 9px;cursor:pointer}
.tool button:hover{background:rgba(255,255,255,.1)}
.tool .del{color:var(--bad)}
.parts{display:flex;gap:2px;background:rgba(0,0,0,.25);border-radius:10px;padding:2px}
.parts:empty{display:none}
.parts button{padding:5px 9px!important;font-size:11px!important;color:var(--mute)!important}
.parts button[aria-pressed="true"]{background:rgba(255,255,255,.16)!important;color:var(--ink)!important;font-weight:700}
#swatches{display:flex;gap:4px;margin:0 2px}
.sw.custom{position:relative;overflow:hidden;cursor:pointer;background:conic-gradient(#ff6b6b,#ffd166,#06d6a0,#4cc9f0,#b388eb,#ff6b6b);display:inline-block;flex:none}
.sw.custom input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.sw{width:22px;height:22px;padding:0!important;border-radius:50%!important;border:2px solid rgba(255,255,255,.25)!important}
.tip{position:fixed;z-index:3;pointer-events:none;padding:7px 12px;font-size:12px;border-radius:12px;transform:translate(-50%,-140%);white-space:nowrap;opacity:0;transition:opacity .15s}
.tip.show{opacity:1}
.toast{position:fixed;z-index:5;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translate(-50%,-10px);padding:10px 18px;font-size:13px;font-weight:700;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.panel{position:absolute;right:16px;top:calc(84px + env(safe-area-inset-top,0px));width:300px;padding:16px}
.panel h3{margin:0 0 4px;font-family:var(--display);font-weight:400;font-size:20px}
.panel p{margin:0 0 10px;font-size:12px;color:var(--mute)}
.panel ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:13px}
.panel li{display:flex;gap:10px;align-items:center}
.panel li em{width:40px;height:26px;border-radius:6px;flex:none}
.panel li.now{color:var(--accent);font-weight:700}
.panel .x{position:absolute;right:10px;top:10px}
.panel{width:360px;max-height:calc(100% - 210px);overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.panel p{margin:0}
.plchips{display:flex;flex-wrap:wrap;gap:6px}
.plchips button{font:inherit;font-size:12px;color:var(--ink);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:12px;padding:6px 10px;cursor:pointer}
.plchips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.plhead{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.plhead input{flex:1;min-width:0;font:inherit;font-size:15px;color:var(--ink);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.plhead button,.trk button{font:inherit;font-size:12px;color:var(--ink);background:rgba(255,255,255,.08);border:0;border-radius:9px;padding:6px 9px;cursor:pointer}
.plhead .feat[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
.plhead .delpl{color:var(--bad)}
.panel ol{gap:4px}
.trk{display:flex;gap:8px;align-items:center;padding:6px;border-radius:10px}
.trk.now{background:rgba(255,184,107,.12)}
.trk .n{width:18px;text-align:center;color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.trk .t{flex:1;min-width:0}.trk .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.trk .t small{color:var(--mute);font-size:11px}
.trk.now .t b{color:var(--accent)}
.trk .x2{color:var(--bad)}
.empty{font-size:13px;color:var(--mute);padding:10px;border:1px dashed var(--line);border-radius:12px;text-align:center}
.pladd{display:grid;grid-template-columns:1fr auto;gap:6px}
.pladd input{font:inherit;font-size:13px;color:var(--ink);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0}
.pladd #pl-url{grid-column:1/-1}
.pladd input:focus-visible,.plhead input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.pladd .err{grid-column:1/-1;color:var(--bad);font-size:12px;min-height:0}
.plfoot{font-size:11px;color:var(--mute)}
.ro [data-edit]{display:none!important}
a.btn{text-decoration:none}
.player .btn.ghost{flex:none}
.sizerow{flex-basis:100%;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mute);padding:4px 8px 2px;border-top:1px solid var(--line);margin-top:4px}
.sizerow label{display:flex;align-items:center;gap:6px}
.sizerow input{width:96px;accent-color:var(--accent)}
.sizerow output{font-variant-numeric:tabular-nums;color:var(--ink)}
.tool{flex-wrap:wrap;max-width:min(860px,calc(100vw - 32px))}
.dress{position:fixed;z-index:4;right:16px;top:calc(84px + env(safe-area-inset-top,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:340px;padding:18px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.dhd b{font-family:var(--display);font-weight:400;font-size:22px;display:block}
.dhd span{font-size:12px;color:var(--mute)}
.fld{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--mute)}
.fld input{font:inherit;font-size:15px;color:var(--ink);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.fld input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sec .lab{font-size:12px;color:var(--mute);margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{font:inherit;font-size:13px;color:var(--ink);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer}
.opts button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.opts button .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1px solid rgba(255,255,255,.4)}
.pal{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pal .sw{width:30px;height:30px}
.dft{margin-top:auto;display:flex;gap:8px}.dft .pill{flex:1}
body.dressing .bottom,body.dressing .side,body.dressing .hint{display:none}
@media (max-width:760px){
  .dress{left:16px;right:16px;width:auto;top:auto;height:52vh}
  .hint{top:auto;bottom:calc(108px + env(safe-area-inset-bottom,0px));font-size:12px}
  body.editing .hint{bottom:calc(196px + env(safe-area-inset-bottom,0px))}
  .themes{top:calc(76px + env(safe-area-inset-top,0px))}
  .side,.friends,.hint .long,#prev,#yt{display:none}
  .th{width:64px;height:40px}
  .panel{left:16px;right:16px;width:auto;top:calc(136px + env(safe-area-inset-top,0px))}
  .dh span{display:none}
  .tool{flex-wrap:wrap;max-width:calc(100vw - 32px);justify-content:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<canvas id="c" tabindex="0" aria-label="3D 리스닝 룸. 드래그해서 회전, 스크롤로 확대"></canvas>
<div class="ui">
  <div class="brand glass"><div class="lg">♪</div><div><b>새벽 감성 방</b><span id="cloud">lofi.room · 3D 프로토타입</span></div></div>
  <div class="hint glass" id="hint"></div>
  <div class="themes glass" role="group" aria-label="방 꾸미기">
    <button id="dress" class="chip">☺ 캐릭터 꾸미기</button>
    <button id="edit">✎ 방 꾸미기</button>
  </div>
  <div class="side glass">
    <button class="chip" id="v-reset">⟲ 기본 시점</button>
    <button class="chip" id="v-top">⬒ 위에서 보기</button>
    <button class="chip" id="v-spin" aria-pressed="true">↻ 자동 회전 켜짐</button>
  </div>
  <div class="panel glass" id="pl" hidden>
    <button class="btn ghost x" id="pl-x" aria-label="닫기">✕</button>
    <h3>플레이리스트</h3><p id="pl-sub">LP 선반 = 내 플레이리스트 · 대표 플레이리스트는 방문자에게 들려줘요</p>
    <div class="plchips" id="pl-chips"></div>
    <div class="plhead" id="pl-head"></div>
    <ol id="pl-list"></ol>
    <form class="pladd" id="pl-add" novalidate>
      <input id="pl-url" placeholder="유튜브 링크 붙여넣기" autocomplete="off" aria-label="유튜브 링크">
      <input id="pl-title" placeholder="곡 제목 (선택)" autocomplete="off" aria-label="곡 제목">
      <button class="pill save" type="submit">추가</button>
      <small class="err" id="pl-err" aria-live="polite"></small>
    </form>
    <div class="plfoot"><span id="pl-status"></span></div>
  </div>
  <div class="bottom">
    <div class="player glass" id="player">
      <div class="th"></div>
      <div class="info"><b id="song">Midnight City — lofi hip hop mix</b><span id="song-sub">플레이리스트에 곡을 추가해보세요</span><div class="bar"><i id="prog"></i></div></div>
      <div class="friends"><i></i>3명 함께 듣는 중</div>
      <button class="btn ghost" id="prev" aria-label="이전 곡">⏮</button>
      <button class="btn" id="play" aria-label="재생 / 일시정지">❚❚</button>
      <button class="btn ghost" id="next" aria-label="다음 곡">⏭</button>
      <a class="btn ghost yt" id="yt" href="https://www.youtube.com" target="_blank" rel="noopener" aria-label="유튜브에서 열기" title="유튜브에서 열기">▶</a>
      <button class="btn ghost" id="pl-open" aria-label="플레이리스트" title="플레이리스트">☰</button>
    </div>
    <div class="drawer glass" id="drawer" hidden>
      <div class="dh"><div class="dtabs" role="tablist"><button role="tab" id="tab-floor" aria-selected="true">바닥 가구</button><button role="tab" id="tab-wall" aria-selected="false">벽 장식</button></div><span id="dsub">누르면 방에 나타나요 · 가구를 눌러 색 바꾸기 · 벽과 바닥도 눌러보세요</span>
        <div class="acts"><button class="pill" id="cancel">취소</button><button class="pill save" id="save">저장하기</button></div></div>
      <div class="items" id="items"></div>
      <div class="items" id="items-wall" hidden></div>
    </div>
  </div>
</div>
<div class="dress glass" id="dresser" hidden>
  <div class="dhd"><b>캐릭터 꾸미기</b><span>바꾸는 대로 방 안의 내 캐릭터에 바로 보여요</span></div>
  <label class="fld">닉네임<input id="nick" maxlength="10" value="나" autocomplete="off"></label>
  <div class="sec"><div class="lab">헤어 스타일</div><div class="opts" id="styles"></div></div>
  <div class="sec"><div class="lab">액세서리</div><div class="opts" id="accs"></div></div>
  <div class="sec"><div class="lab">색 바꾸기</div><div class="opts parts2" id="cparts"></div>
    <div class="pal" id="cpal"></div></div>
  <div class="dft"><button class="pill" id="d-cancel">취소</button><button class="pill save" id="d-save">저장하기</button></div>
</div>
<div class="tool glass" id="tool" hidden>
  <span class="nm" id="tool-name"></span>
  <button id="rot" title="회전 (R)">↻ 회전</button>
  <span class="parts" id="parts" role="group" aria-label="색을 바꿀 부분"></span>
  <span id="swatches"></span>
  <label class="sw custom" title="직접 고르기"><input type="color" id="custom" value="#ff8ad1" aria-label="색 직접 고르기"></label>
  <button id="photo" hidden>🖼 사진 넣기</button>
  <div class="sizerow" id="sizeRow" hidden><span>크기</span><label>가로 <input type="range" id="sz-w" min="0.5" max="3.6" step="0.1"></label><label>세로 <input type="range" id="sz-h" min="0.5" max="3.6" step="0.1"></label><output id="sz-out"></output></div>
  <button class="del" id="del" title="치우기 (Del)">✕ 치우기</button>
</div>
<input type="file" id="photoInput" accept="image/*" hidden>
<div class="tip glass" id="tip"></div>
<div class="toast glass" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
THREE.ColorManagement.legacyMode = false;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 200);
const HOME = new THREE.Vector3(17, 13, 17);
camera.position.copy(HOME);
const controls = new THREE.OrbitControls(camera, canvas);
controls.target.set(0, 1.8, 0);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 9; controls.maxDistance = 38;
controls.maxPolarAngle = Math.PI*0.47; controls.minPolarAngle = 0.15;
controls.enablePan = false;

// ---------- helpers ----------
const mats = {};
function M(key, color, opts={}){ if(!mats[key]) mats[key]=new THREE.MeshStandardMaterial({color, roughness:.8, metalness:0, ...opts}); return mats[key]; }
function mat(color, opts={}){ return new THREE.MeshStandardMaterial({color, roughness:.8, ...opts}); }
function mesh(geo, material, x=0,y=0,z=0, parent=scene){ const m=new THREE.Mesh(geo, material); m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; parent.add(m); return m; }
function box(w,h,d,material,x,y,z,parent){ return mesh(new THREE.BoxGeometry(w,h,d), material, x,y,z,parent); }
function rbox(w,h,d,r,material,x,y,z,parent){
  const s=new THREE.Shape(), hw=w/2-r, hh=h/2-r;
  s.moveTo(-hw,-h/2); s.lineTo(hw,-h/2); s.quadraticCurveTo(w/2,-h/2,w/2,-hh); s.lineTo(w/2,hh); s.quadraticCurveTo(w/2,h/2,hw,h/2);

function buildAvatar(o){
  const g=new THREE.Group(); g.position.set(...o.pos); g.rotation.y=o.rot||0; (o.parent||scene).add(g);
  const skin=mat(o.skin,{roughness:.6}), shirt=mat(o.shirt), pants=mat(o.pants), hair=mat(o.hair,{roughness:.7}), shoe=mat(o.shoes||'#ffffff');
  const sit=o.pose==='sit';
  if(sit){ [-.17,.17].forEach(x=>{ const l=mesh(new THREE.CapsuleGeometry(.13,.42,6,12), pants, x,.15,.3, g); l.rotation.x=Math.PI/2; sph(.15, shoe, x,.12,.62, g); }); }
  else { [-.17,.17].forEach(x=>{ mesh(new THREE.CapsuleGeometry(.13,.45,6,12), pants, x,.38,0, g); sph(.16, shoe, x,.08,.06, g); }); }
  const by = sit ? .55 : .95;
  mesh(new THREE.CapsuleGeometry(.36,.32,8,16), shirt, 0,by+.2,0, g);
  mesh(new THREE.CapsuleGeometry(.1,.4,6,10), shirt, -.45,by+.18,0, g).rotation.z=.25;
  const armR=mesh(new THREE.CapsuleGeometry(.1,.4,6,10), shirt, .45,by+.18,0, g); armR.rotation.z=-.25;
  if(o.wave){ armR.rotation.z=-2.4; armR.position.set(.55,by+.55,0); }
  const head=new THREE.Group(); head.position.set(0,by+.95,0); g.add(head);
  sph(.5, skin, 0,0,0, head);
  const st=o.style;
  if(st!=='beanie' && st!=='curly') mesh(new THREE.SphereGeometry(st==='short'?.52:.54,32,16,0,Math.PI*2,0,Math.PI*(st==='short'?.42:.52)), hair, 0,.04,-.03, head).rotation.x=st==='short'?-.35:-.25;
  if(st==='bun') sph(.2, hair, 0,.58,-.12, head);
  if(st==='long'){ const b=mesh(new THREE.CapsuleGeometry(.42,.55,6,16), hair, 0,-.35,-.2, head); b.scale.z=.6; }
  if(st==='cap'){ cyl(.32,.32,.04, hair, 0,.32,.42, head).scale.z=1.3; }
  if(st==='curly'){ for(let i=0;i<14;i++){ const a=i/14*Math.PI*2; sph(.17, hair, Math.cos(a)*.42, .22+Math.sin(i*1.7)*.08, Math.sin(a)*.42-.05, head); } sph(.42, hair, 0,.3,-.05, head); }
  if(st==='spiky'){ mesh(new THREE.SphereGeometry(.53,32,16,0,Math.PI*2,0,Math.PI*.4), hair, 0,.04,-.03, head); for(let i=0;i<7;i++){ const a=i/7*Math.PI*2; const c=mesh(new THREE.ConeGeometry(.12,.38,8), hair, Math.cos(a)*.25,.55,Math.sin(a)*.25-.05, head); c.rotation.set(Math.sin(a)*.6,0,-Math.cos(a)*.6); } }
  if(st==='beanie'){ mesh(new THREE.SphereGeometry(.56,32,16,0,Math.PI*2,0,Math.PI*.5), hair, 0,.06,0, head); const band=new THREE.Mesh(new THREE.TorusGeometry(.55,.07,10,32), mat('#f3efe6')); band.rotation.x=Math.PI/2; band.position.y=.08; head.add(band); sph(.13, mat('#f3efe6'), 0,.66,0, head); }
  [-.18,.18].forEach(x=>{ sph(.06, mat('#2a1a20',{roughness:.3}), x,.02,.46, head); if(o.blush!==false) sph(.08, mat('#ff8fa3',{transparent:true,opacity:.6}), x*1.5,-.12,.4, head).scale.z=.4; });
  if(o.glasses){ [-.18,.18].forEach(x=>{ const r=new THREE.Mesh(new THREE.TorusGeometry(.12,.02,8,24), mat(o.glassColor||'#2a1a44')); r.position.set(x,.02,.5); head.add(r); }); }
  if(o.phones){ const band=new THREE.Mesh(new THREE.TorusGeometry(.56,.05,10,32,Math.PI), mat(o.phones)); band.position.y=.05; head.add(band);
    [-.56,.56].forEach(x=>{ cyl(.17,.17,.16, mat(o.phones), x,0,0, head).rotation.z=Math.PI/2; }); }
  const tag=label(o.name, o.tagBg, o.dot); tag.position.set(0,by+1.85+(st==='bun'||st==='spiky'?.15:0),0); g.add(tag);
  let bub=null; if(o.say){ bub=bubble(o.say); bub.position.set(.9,by+2.45,0); g.add(bub); }
  return {g, head, by, bub};
}

$('d-cancel').addEventListener('click',()=>{ const p=me.o.parent; me.o={...dressSnap, parent:p}; rebuildAvatar(me); setDressing(false); toast('변경을 취소했어요'); });

// ---------- playlists (YouTube links) ----------
const cloud={db:null, assets:null, user:null, canEdit:true};
let playlists=[], openPL=null, nowPL=null, nowIdx=0;
const EXAMPLE_PL=[{id:'example', name:'새벽 감성 로파이 (예시)', order:0, featured:true, tracks:[{k:'v', y:'jfKfPfyJRdk', title:'lofi hip hop radio — beats to relax/study to'}]}];
function parseYT(raw){ let u; try{ u=new URL(raw.trim().match(/^https?:/)?raw.trim():'https://'+raw.trim()); }catch(e){ return null; }
  const h=u.hostname.replace(/^www\.|^m\.|^music\./,''); const id=/^[\w-]{11}$/;
  if(h==='youtu.be'){ const v=u.pathname.slice(1,12); if(id.test(v)) return {k:'v', y:v}; }
  if(h==='youtube.com'||h==='youtube-nocookie.com'){
    const v=u.searchParams.get('v'); if(v&&id.test(v)) return {k:'v', y:v};
    const m=u.pathname.match(/^\/(shorts|embed|live)\/([\w-]{11})/); if(m) return {k:'v', y:m[2]};
    const l=u.searchParams.get('list'); if(l&&/^[\w-]{10,64}$/.test(l)) return {k:'l', y:l}; }
  return null; }
function ytUrl(t){ return t.k==='l'?'https://www.youtube.com/playlist?list='+t.y:'https://www.youtube.com/watch?v='+t.y; }
function featured(){ return playlists.find(p=>p.featured)||playlists[0]||null; }
function setStatus(t){ $('pl-status').textContent=t; }
const writeChains={};
function savePL(p){ if(!cloud.db||p.id==='example'){ setStatus(cloud.db?'':'이 미리보기에서만 바뀌어요 · 저장하려면 공유된 링크에서 열어주세요'); return; }
  setStatus('저장 중…'); const body={name:p.name, order:p.order, featured:!!p.featured, tracks:p.tracks};
  writeChains[p.id]=(writeChains[p.id]||Promise.resolve()).then(()=>cloud.db.doc('playlists/'+p.id).set(body))
    .then(()=>setStatus('저장됨 · 방문자에게도 보여요')).catch(e=>{ setStatus(''); toast(e&&e.code==='quota_exceeded'?'저장 공간이 가득 찼어요. 안 쓰는 플레이리스트를 지워주세요':'플레이리스트를 저장하지 못했어요'); }); }
function renderPL(){
  const chips=$('pl-chips'), head=$('pl-head'), list=$('pl-list'); const ed=cloud.canEdit;
  if(!playlists.some(p=>p===openPL)) openPL=featured();
  chips.innerHTML=''; playlists.forEach(p=>{ const b=document.createElement('button'); b.textContent=(p.featured?'★ ':'')+p.name; b.setAttribute('aria-pressed',p===openPL); b.addEventListener('click',()=>{ openPL=p; renderPL(); }); chips.appendChild(b); });
  if(ed){ const nb=document.createElement('button'); nb.textContent='＋ 새 플레이리스트'; nb.dataset.edit=''; nb.addEventListener('click',newPL); chips.appendChild(nb); }
  head.innerHTML=''; list.innerHTML='';
  $('pl-add').hidden=!ed||!openPL;
  if(!openPL){ list.innerHTML='<li class="empty">'+(ed?'아직 플레이리스트가 없어요. ＋ 새 플레이리스트를 눌러 유튜브 링크로 첫 곡을 넣어보세요.':'아직 플레이리스트가 없어요.')+'</li>'; return; }
  if(ed){ const inp=document.createElement('input'); inp.value=openPL.name; inp.maxLength=40; inp.setAttribute('aria-label','플레이리스트 이름'); let t;
      inp.addEventListener('input',()=>{ openPL.name=inp.value.trim()||'이름 없는 플레이리스트'; clearTimeout(t); t=setTimeout(()=>{ savePL(openPL); renderChipsOnly(); },600); }); head.appendChild(inp);
    const f=document.createElement('button'); f.className='feat'; f.textContent='★ 대표'; f.title='방문자가 들어오면 이 플레이리스트가 재생돼요'; f.setAttribute('aria-pressed',!!openPL.featured);
      f.addEventListener('click',()=>{ playlists.forEach(p=>{ if(p.featured&&p!==openPL){ p.featured=false; savePL(p); } }); openPL.featured=true; savePL(openPL); renderPL(); startPL(openPL); }); head.appendChild(f);
    const d=document.createElement('button'); d.className='delpl'; d.textContent='삭제'; d.addEventListener('click',()=>deletePL(openPL,d)); head.appendChild(d);
  } else { const b=document.createElement('b'); b.textContent=openPL.name; head.appendChild(b); }
  if(!openPL.tracks.length) list.innerHTML='<li class="empty">'+(ed?'아래에 유튜브 링크를 붙여넣어 곡을 추가하세요.':'아직 곡이 없어요.')+'</li>';
  openPL.tracks.forEach((t,i)=>{ const li=document.createElement('li'); li.className='trk'+(nowPL===openPL&&nowIdx===i?' now':'');
    li.innerHTML=`<span class="n">${i+1}</span><span class="t"><b></b><small>${t.k==='l'?'유튜브 재생목록':'유튜브 영상'} · ${t.y}</small></span>`; li.querySelector('b').textContent=t.title;
    const play=document.createElement('button'); play.textContent='▶'; play.setAttribute('aria-label','재생'); play.addEventListener('click',()=>{ startPL(openPL,i); renderPL(); }); li.appendChild(play);
    if(ed){ [['↑',-1],['↓',1]].forEach(([g,dlt])=>{ const b=document.createElement('button'); b.textContent=g; b.setAttribute('aria-label',dlt<0?'위로':'아래로'); b.disabled=(i+dlt<0||i+dlt>=openPL.tracks.length);
        b.addEventListener('click',()=>{ const a=openPL.tracks; [a[i],a[i+dlt]]=[a[i+dlt],a[i]]; if(nowPL===openPL){ if(nowIdx===i) nowIdx=i+dlt; else if(nowIdx===i+dlt) nowIdx=i; } savePL(openPL); renderPL(); }); li.appendChild(b); });
      const x=document.createElement('button'); x.className='x2'; x.textContent='✕'; x.setAttribute('aria-label','빼기'); x.addEventListener('click',()=>{ openPL.tracks.splice(i,1); if(nowPL===openPL&&nowIdx>=openPL.tracks.length) nowIdx=0; savePL(openPL); renderPL(); updateNow(); }); li.appendChild(x); }
    list.appendChild(li); });
}
function renderChipsOnly(){ const keep=document.activeElement; renderPL(); if(keep&&keep.getAttribute('aria-label')==='플레이리스트 이름'){ const i=$('pl-head').querySelector('input'); i.focus(); i.setSelectionRange(i.value.length,i.value.length); } }
function newPL(){ const id=(Date.now().toString(36)+Math.random().toString(36).slice(2,6)); const p={id, name:'새 플레이리스트', order:playlists.length, featured:!playlists.length, tracks:[]};
  playlists.push(p); openPL=p; savePL(p); renderPL(); const i=$('pl-head').querySelector('input'); if(i){ i.focus(); i.select(); } }
function deletePL(p,btn){ if(btn.dataset.sure!=='1'){ btn.dataset.sure='1'; btn.textContent='정말 삭제?'; setTimeout(()=>{ if(btn.isConnected){ btn.dataset.sure=''; btn.textContent='삭제'; } },3000); return; }
  playlists.splice(playlists.indexOf(p),1); if(cloud.db&&p.id!=='example') cloud.db.doc('playlists/'+p.id).delete().catch(()=>toast('삭제하지 못했어요'));
  if(p.featured&&playlists[0]){ playlists[0].featured=true; savePL(playlists[0]); } if(nowPL===p) startPL(featured()); openPL=featured(); renderPL(); }
$('pl-add').addEventListener('submit',e=>{ e.preventDefault(); const err=$('pl-err'); const t=parseYT($('pl-url').value);
  if(!t){ err.textContent='유튜브 영상이나 재생목록 링크를 넣어주세요. 예: https://youtu.be/… 또는 youtube.com/watch?v=…'; return; }
  err.textContent=''; t.title=$('pl-title').value.trim()||(t.k==='l'?'유튜브 재생목록':'유튜브 영상')+' · '+t.y;
  openPL.tracks.push(t); $('pl-url').value=''; $('pl-title').value=''; savePL(openPL); if(!nowPL||!nowPL.tracks.length) startPL(openPL,openPL.tracks.length-1); else updateNow(); renderPL(); });
function startPL(p,i=0){ nowPL=p; nowIdx=i; progress=0; updateNow(); }
function updateNow(){ const t=nowPL&&nowPL.tracks[nowIdx];
  songTitle=t?t.title:'플레이리스트가 비어 있어요'; $('song').textContent=songTitle;
  $('song-sub').textContent=t?(nowPL.name+' · '+(nowIdx+1)+'/'+nowPL.tracks.length):(cloud.canEdit?'☰ 를 눌러 유튜브 링크를 추가해보세요':'아직 곡이 없어요');
  const a=$('yt'); a.href=t?ytUrl(t):'https://www.youtube.com'; a.title=t?'유튜브에서 열기':'유튜브'; }
function step(d){ if(!nowPL||!nowPL.tracks.length) return; nowIdx=(nowIdx+d+nowPL.tracks.length)%nowPL.tracks.length; progress=0; updateNow(); if(!$('pl').hidden) renderPL(); }
$('prev').addEventListener('click',()=>step(-1)); $('next').addEventListener('click',()=>step(1));
$('pl-open').addEventListener('click',()=>{ const p=$('pl'); p.hidden=!p.hidden; if(!p.hidden) renderPL(); });
function setPlaylists(list){ const cur=nowPL&&nowPL.id, curIdx=nowIdx, open=openPL&&openPL.id; playlists=list.sort((a,b)=>(a.order||0)-(b.order||0));
  openPL=playlists.find(p=>p.id===open)||null; const np=playlists.find(p=>p.id===cur);
  if(np){ nowPL=np; nowIdx=Math.min(curIdx,Math.max(0,np.tracks.length-1)); updateNow(); } else startPL(featured());
  if(!$('pl').hidden) renderPL(); }

// ---------- cloud: save the room, character, photos and playlists for every visitor ----------
let lastRoomJSON='', pendingRoom=null;
async function saveRoom(what='방을'){
  if(!cloud.db){ toast(what+' 저장했어요 · 이 미리보기에서만 유지돼요'); return; }
  try{
    let failedPhotos=0;
    for(const g of movables){ const id=g.userData.photoId; if(!id||!id.startsWith('local:')) continue;
      if(!cloud.assets){ failedPhotos++; continue; }
      try{ const r=await cloud.assets.upload(localPhotos[id].blob); localPhotos[r.id]=localPhotos[id]; movables.forEach(o=>{ if(o.userData.photoId===id) o.userData.photoId=r.id; }); }
      catch(e){ failedPhotos++; } }
    const d=serializeRoom(); d.wall.forEach(w=>{ if(w.p&&w.p.startsWith('local:')) w.p=null; });
    lastRoomJSON=JSON.stringify(d); await cloud.db.doc('room/main').set(d);
    toast(failedPhotos?`${what} 저장했어요 · 사진 ${failedPhotos}장은 올리지 못했어요`:`${what} 저장했어요 · 다시 열어도 그대로예요`);
  }catch(e){ toast(e&&e.code==='invalid_argument'?'이 방은 주인만 저장할 수 있어요':'저장하지 못했어요. 잠시 후 다시 시도해주세요'); } }
function setReadOnly(ro){ cloud.canEdit=!ro; document.body.classList.toggle('ro',ro); $('edit').hidden=ro; $('dress').hidden=ro;
  $('cloud').textContent = ro ? '구경 중 · 방 주인만 꾸밀 수 있어요' : '☁ 저장하면 다시 열어도 그대로예요';
  me.onBuild=a=>{ if(!ro) clickable(a.g,'나 · 눌러서 캐릭터 꾸미기', ()=>setDressing(true)); }; rebuildAvatar(me); }
(async function connect(){
  updateNow();
  const C=window.claude; if(!C||typeof C.use!=='function'){ setPlaylists(EXAMPLE_PL.map(p=>({...p,tracks:p.tracks.slice()}))); return; }
  const [db,user]=await Promise.all([C.use('db'),C.use('user')]);
  if(!db){ setPlaylists(EXAMPLE_PL.map(p=>({...p,tracks:p.tracks.slice()}))); return; }
  cloud.db=db; cloud.user=user;
  const ed=user?await user.canEdit():null; if(ed===false) setReadOnly(true); else { setReadOnly(false); cloud.assets=await C.use('assets'); }
  db.doc('room/main').onSnapshot(snap=>{ if(!snap.exists||snap.metadata.hasPendingWrites) return; const d=snap.data(); const js=JSON.stringify(d); if(js===lastRoomJSON) return;
    lastRoomJSON=js; if(editing||dressing) pendingRoom=d; else applyRoom(d); }, ()=>{});
  db.collection('playlists').onSnapshot(qs=>{ if(qs.metadata.hasPendingWrites) return; setPlaylists(qs.docs.map(d=>({id:d.id, ...d.data(), tracks:(d.data().tracks||[]).slice()}))); },
    ()=>toast('플레이리스트를 불러오지 못했어요'));
})();

// ---------- picking ----------
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(), tip=$('tip'), floorPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
let downAt=null;
function setRay(ev){ const r=canvas.getBoundingClientRect(); mouse.set(((ev.clientX-r.left)/r.width)*2-1, -((ev.clientY-r.top)/r.height)*2+1); ray.setFromCamera(mouse,camera); }
function isShown(o){ while(o){ if(!o.visible) return false; o=o.parent; } return true; }
function pick(ev){ setRay(ev); const hits=ray.intersectObjects(clickables,true).filter(h=>isShown(h.object)); return hits.length?hits[0].object.userData.hit:null; }
function pickMovable(ev){ setRay(ev); const hits=ray.intersectObjects(movables,true).filter(h=>isShown(h.object)&&!h.object.isSprite);
  if(!hits.length) return null; let o=hits[0].object; while(o&&!o.userData.movable) o=o.parent; return o; }
function floorPoint(ev){ setRay(ev); const p=new THREE.Vector3(); return ray.ray.intersectPlane(floorPlane,p)?p:null; }

canvas.addEventListener('pointerdown',ev=>{ downAt=[ev.clientX,ev.clientY];
  if(!editing) return;
  const g=pickMovable(ev);
  if(g&&g.userData.wall){ select(g); drag={wall:true, g, startParent:g.parent, start:g.position.clone(), ok:true}; controls.enabled=false; canvas.setPointerCapture(ev.pointerId); }
  else if(g){ select(g); const fp=floorPoint(ev); drag={g, start:g.position.clone(), off:fp?fp.sub(g.position):new THREE.Vector3(), ok:true}; controls.enabled=false; canvas.setPointerCapture(ev.pointerId); }
});
canvas.addEventListener('pointermove',ev=>{
  if(drag&&drag.wall){ const wp=wallPoint(ev); if(!wp) return; const g=drag.g; const [w,h]=sizeOf(g); const snap=v=>Math.round(v*4)/4;
    const u=Math.max(-4.9+w/2,Math.min(4.9-w/2,snap(wp.u))), v=Math.max(1.62+h/2,Math.min(H-.12-h/2,snap(wp.v)));
    if(g.parent!==wp.wg) wp.wg.add(g); g.position.set(u,v,T/2+.06); drag.ok=validWall(g,wp.wg,u,v); showWallFP(g,drag.ok); canvas.style.cursor='grabbing'; tip.classList.remove('show'); return; }
  if(drag){ const fp=floorPoint(ev); if(!fp) return; const p=fp.sub(drag.off); const f=footprint(drag.g);
    const snap=v=>Math.round(v*4)/4; p.set(snap(p.x),0,snap(p.z));
    p.x=Math.max(-INNER+f.w/2,Math.min(INNER-f.w/2,p.x)); p.z=Math.max(-INNER+f.d/2,Math.min(INNER-f.d/2,p.z));
    drag.g.position.copy(p); drag.g.position.y=.15; drag.ok=valid(drag.g,p,drag.g.rotation.y); showFP(drag.g,drag.ok); canvas.style.cursor='grabbing'; tip.classList.remove('show'); return; }
  if(editing){ const g=pickMovable(ev); canvas.style.cursor=g?'grab':'default';
    if(g){ tip.textContent=cat(g).name+(g.userData.wall?' · 벽 위에서 끌어 옮기기':' · 끌어서 옮기기')+(g.userData.photo?' · 사진 파일을 끌어다 놓아도 돼요':' · 눌러서 색 바꾸기'); tip.style.left=ev.clientX+'px'; tip.style.top=ev.clientY+'px'; tip.classList.add('show'); } else tip.classList.remove('show'); return; }
  const h=pick(ev); if(h){ tip.textContent=h.name; tip.style.left=ev.clientX+'px'; tip.style.top=ev.clientY+'px'; tip.classList.add('show'); canvas.style.cursor='pointer'; } else { tip.classList.remove('show'); canvas.style.cursor='grab'; } });
canvas.addEventListener('pointerup',ev=>{
  if(drag&&drag.wall){ const g=drag.g; if(!drag.ok){ drag.startParent.add(g); g.position.copy(drag.start); toast('창문·TV나 다른 장식과 겹쳐서 원래 자리로 돌아갔어요'); } g.position.z=T/2; drag=null; controls.enabled=true; select(g); return; }
  if(drag){ const g=drag.g; if(!drag.ok){ g.position.copy(drag.start); toast('다른 가구와 겹쳐서 원래 자리로 돌아갔어요'); } g.position.y=0; drag=null; controls.enabled=true; select(g); return; }
  if(!downAt) return; const moved=Math.hypot(ev.clientX-downAt[0],ev.clientY-downAt[1]); downAt=null; if(moved>5) return;
  if(editing){ if(pickMovable(ev)) return; setRay(ev); const hit=ray.intersectObjects(surfMeshes,false).find(h=>isShown(h.object));
    if(hit) selectSurface(hit.object===floorMesh?'floor':'wall', hit.point); else select(null); return; }
  const h=pick(ev); if(h) h.act(); });

// ---------- loop ----------
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.fov = w<760 ? 48 : 35; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();
let tvTick=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; const t=now/1000;
  if(tween){ tween.t=Math.min(1,tween.t+dt*1.4); const e=1-Math.pow(1-tween.t,3); camera.position.lerpVectors(tween.from,tween.to,e); controls.target.lerpVectors(tween.tf,tween.tt,e); if(tween.t>=1) tween=null; }
  controls.update();
  const p=camera.position; walls.forEach(w=>{ w.g.visible=!w.outside(p); });
  const beat = playing ? Math.pow(Math.max(0,Math.sin(t*Math.PI*2*1.4)),8) : 0;
  if(playing){ if(record) record.rotation.y -= dt*3.5; const np=progress+dt/225; if(np>=1) step(1); else progress=np; }
  prog.style.width=(progress*100)+'%';
  speakers.forEach(s=>{ s.userData.kick=Math.max(0,(s.userData.kick||0)-dt*2); const k=1+beat*.06+s.userData.kick*.15; s.userData.cones.forEach(c=>c.scale.set(k,1,k)); });
  avatars.forEach(a=>{ a.head.rotation.z = playing? Math.sin(t*Math.PI*1.4+a.phase)*.08 : 0; a.head.position.y=a.by+.95+(playing?beat*.04:0); if(a.bub) a.bub.position.y=a.by+2.45+Math.sin(t*2+a.phase)*.05; });
  notes.forEach((n,i)=>{ n.userData.t=(n.userData.t+dt*(playing?.12:0))%1; const u=n.userData.t; n.position.set((i%2?3:-3)+Math.sin(u*6+i)*.4, 3.2+u*2.8, -3.7+Math.cos(i)*.3); n.material.opacity=(playing&&!editing)?Math.sin(u*Math.PI):0; });
  bulbs.forEach((b,i)=>b.scale.setScalar(1+Math.sin(t*3+i)*.15));
  movables.forEach(g=>{ if(g.userData.type==='lamp'){ const on=!g.userData.off; if(g.userData.light) g.userData.light.intensity += ((on?1.6:0)-g.userData.light.intensity)*.15; g.userData.shade.material.emissiveIntensity=on?.9:.05; } });
  tvLight.intensity=1+beat*.5;
  if((tvTick%1)<dt){ const d=new Date(); movables.forEach(g=>{ const hd=g.userData.hands; if(!hd) return; hd[0].rotation.z=-((d.getHours()%12)+d.getMinutes()/60)/12*Math.PI*2; hd[1].rotation.z=-(d.getMinutes()+d.getSeconds()/60)/60*Math.PI*2; }); }
  if(selected){ selBox.setFromObject(selected); } if(selected||surface) placeTool();
  if((tvTick+=dt)>.1){ tvTick=0; drawTV(now); }
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
